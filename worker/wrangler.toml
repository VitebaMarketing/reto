name = "reto-viteba-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "reto-viteba"
# Base de datos de producción (cuenta de Viteba, jurisdicción UE)
database_id = "163f4050-3672-42d3-afed-4d2b37b9ad93"

[vars]
EVENT_NAME = "OAFI 2026"
# Orígenes que pueden llamar a la API, separados por comas (la URL pública del juego).
ALLOWED_ORIGINS = "https://vitebamarketing.github.io,http://localhost:5173"
# "true" muestra la opción de jugar sin dejar datos (no cuenta como lead).
ALLOW_ANONYMOUS = "false"

[observability]
enabled = true

# Secretos (nunca en este archivo): SESSION_SECRET, HASH_PEPPER, STAFF_PASSWORD, ADMIN_PASSWORD
#   wrangler secret put STAFF_PASSWORD
